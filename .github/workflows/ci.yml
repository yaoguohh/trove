# Build + test on every push and pull request. The release workflow only runs on tags, so without
# this the test suite could rot unnoticed between releases.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Select latest stable Xcode (Swift 6 — the runner default is Swift 5.10)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Test
        run: swift test
